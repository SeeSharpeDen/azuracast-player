<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wingless Radio</title>
    <link rel="stylesheet" href="./assets/normalize.css">
    <link rel="stylesheet" href="./assets/style.css">
</head>

<body>
    <div id="stage">
        <!-- <img class="logo kill" src="assets/graphics/branding/ssd_radio_s_masked.png"> -->
        <canvas id="canvas"></canvas>
    </div>

    <div id="player" class="box">
        <div class="album-art loading">
            <div class="loader"></div>
            <img onload="document.querySelector('#player .album-art').classList.remove('loading')"
                src="./assets/graphics/radial-wave.png">
        </div>
        <div class="stack">
            <div class="track-details">
                <h2 id="track-name">Wingless.cc</h2>
                <p id="artist-name">Loading Radio</p>
            </div>
            <p class="blurb">There's <span id="listeners">nobody</span> listening.</p>
            <div class="controls">
                <button id="play-btn">
                    <img class="icon-play" src="./assets/graphics/music-controls.svg#play" alt="⏯️" hidden>
                    <img class="icon-load" src="./assets/graphics/music-controls.svg#loading" alt="⌛">
                    <img class="icon-pause" src="./assets/graphics/music-controls.svg#pause" alt="⏯️" hidden>
                </button>
                <span class="volume">
                    <img class="icon-volume" src="./assets/graphics/music-controls.svg#volume"
                        style="margin-right: var(--gap);">
                    <input type="range" id="volume-slider" min="0" max="100" value="100"
                        oninput="Player.setVolume(this.value / 100)">
                </span>
                <button id="visualiser-btn" onclick="toggle_menu('visualiser-menu')">
                    <img class="icond-spectrum" src="./assets/graphics/music-controls.svg#spectrum" alt="🎞">
                </button>
            </div>
        </div>
    </div>

    <!-- Visualiser menu -->
    <div class="box menu" id="visualiser-menu" hidden>
        <img class="option" data-visualiser="radial-wave/module.js" onclick="pick_visualiser(this);"
            src="./assets/graphics/radial-wave.png">
        <img class="option" data-visualiser="starfield/module.js" onclick="pick_visualiser(this);"
            src="./assets/graphics/starfield.png">
        <img class="option" data-visualiser="spectrum.js" onclick="pick_visualiser(this);"
            src="./assets/graphics/spectrum.png">
    </div>
</body>

<script type="module">
    import { Player } from './assets/player.js';
    import * as Renderer from './assets/renderer.js';
    
    window.set_visualiser = Renderer.set_visualiser;

    const player = new Player("https://cast.wingless.cc/api");
    window.addEventListener("load", async function () {
        player.setup_ui();
        Renderer.init_audio(player.audio_system.context, player.audio_system.source);

        // Load the renderer then a visualizer at the same time we're loading the stations.
        const init_renderer = Renderer.init(document.querySelector("#canvas")).then(() => {
            Renderer.set_visualiser("radial-wave/module.js");
        });
        const init_station = player.set_station("winglessradio");
        await Promise.all([init_renderer, init_station]);
        
    });
</script>

<script>
    function toggle_menu(id) {
        const element = document.getElementById(id);
        if (element.hasAttribute("hidden")) {
            element.removeAttribute("hidden");
        } else {
            element.setAttribute("hidden", "");
        }
    }
    async function pick_visualiser(element) {
        const visualiser_name = element.dataset.visualiser;
        for (const child of element.parentElement.children) {
            child.classList.remove("selected");
        }
        element.classList.add("selected");

        // Hide the menu
        element.parentElement.setAttribute("hidden", "");
        await set_visualiser(visualiser_name);

    }
</script>

</html>
